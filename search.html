<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Search ELAHI CLOTHING for Eastern wear, Western essentials, co-ords, and occasion pieces.">
<title>Search — ELAHI CLOTHING</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#f7f3ee;color:#1c1c1a;font-family:'Jost',sans-serif;font-weight:300}
.font-display{font-family:'Cormorant Garamond',serif}
.eyebrow{font-size:10px;font-weight:500;letter-spacing:.28em;text-transform:uppercase}
.search-input{width:100%;border:0;border-bottom:1px solid rgba(28,28,26,.35);background:transparent;padding:16px 0;color:#1c1c1a;font:300 20px 'Jost',sans-serif;outline:0}
.search-input:focus{border-bottom-color:#6b2737}
.product{display:block;color:inherit;text-decoration:none;border-bottom:1px solid rgba(28,28,26,.12);padding:20px 0}
.product:hover h2{color:#6b2737}
.product h2{margin:0 0 6px;font:400 27px 'Cormorant Garamond',serif;transition:color .2s}
.product p{margin:0;color:#8a8178;font-size:12px}
.empty{color:#8a8178;padding:32px 0}
header{background:rgba(247,243,238,.97);backdrop-filter:blur(8px)}
@media(max-width:767px){.desktop-links{display:none}.brand{font-size:23px}.page{padding:60px 24px}}
</style>
</head>
<body>
<header class="sticky top-0 z-10 border-b border-black/10">
  <div style="height:76px;max-width:1440px;margin:auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;position:relative">
    <a href="index.html" class="eyebrow desktop-links" style="color:#1c1c1a;text-decoration:none">Back to shop</a>
    <a href="index.html" style="position:absolute;left:50%;transform:translateX(-50%);text-align:center;text-decoration:none;color:inherit">
      <span class="font-display brand" style="font-size:30px;letter-spacing:.22em;display:block;line-height:1">ELAHI</span>
      <span class="eyebrow" style="font-size:7px;letter-spacing:.5em;display:block;margin-top:3px">CLOTHING</span>
    </a>
    <a href="account.html" class="eyebrow" style="margin-left:auto;color:#1c1c1a;text-decoration:none">Account</a>
  </div>
</header>
<main class="page" style="max-width:820px;margin:auto;padding:100px 24px 140px">
  <p class="eyebrow" style="color:#6b2737;margin:0 0 16px">Find your next piece</p>
  <h1 class="font-display" style="font-size:clamp(54px,8vw,96px);font-weight:300;line-height:.9;margin:0 0 42px">Search the collection.</h1>
  <label for="search-input" class="eyebrow" style="color:#8a8178">Search clothes</label>
  <input id="search-input" class="search-input" type="search" placeholder="Try “embroidered”, “co-ord”, or “top”" autocomplete="off">
  <p id="result-count" style="color:#8a8178;font-size:12px;margin:18px 0 10px"></p>
  <div id="results"></div>
</main>
<script>
const products=[
  ['Noor Embroidered Suit','Eastern Wear · PKR 8,900','eastern-wear.html'],
  ['Aira Co-ord Set','Western Wear · PKR 6,500','western-wear.html'],
  ['Farah Chiffon Dupatta Set','Eastern Wear · PKR 9,500','eastern-wear.html'],
  ['Rania Contemporary Top','Western Wear · PKR 3,200','western-wear.html'],
  ['Layla Lawn Suit','Eastern Wear · PKR 5,800','eastern-wear.html'],
  ['Zoya Occasion Suit','Occasion · PKR 11,200','collections.html'],
  ['Elan Everyday Shirt','Western Wear · PKR 4,200','sale.html'],
  ['Sana Embellished Kurta','Sale · PKR 3,900','sale.html']
];
const input=document.getElementById('search-input'),results=document.getElementById('results'),count=document.getElementById('result-count');
function render(query=''){
  const term=query.trim().toLowerCase();
  const matches=products.filter(([name,meta])=>(name+' '+meta).toLowerCase().includes(term));
  count.textContent=matches.length+' piece'+(matches.length===1?'':'s')+' found';
  results.innerHTML=matches.length?matches.map(([name,meta,url])=>`<a class="product" href="${url}"><h2>${name} <span style="font:400 18px Jost,sans-serif">↗</span></h2><p>${meta}</p></a>`).join(''):'<p class="empty">No pieces matched that search. Try another word.</p>';
}
input.addEventListener('input',()=>render(input.value));
render();
</script>
</body>
</html>
